name: Sync to Hugging Face hub
on:
  push:
    paths:
      - "configs/config.json"
      - "Dockerfile"
      - ".github/workflows/sync_to_hf_space.yml"
      - "requirements.txt"
      - "*"
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          ref: master
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git branch -m master main 
          git remote set-url origin https://OjciecTadeusz:$HF_TOKEN@huggingface.co/spaces/OjciecTadeusz/gh-hf-sync-start
          git push origin main:main -f
