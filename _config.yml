title: Alex Nowak — Python & AI Engineer
description: Resume of a Python and artificial intelligence engineer building reliable machine-learning products.
url: https://alexnowak.github.io
baseurl: ""

theme: hacked-jekyll

lang: en
author: Alex Nowak

color_bg: gray-9
color_punct: cyan-8
color_key: cyan-4
color_value: gray-3
color_hover: yellow-4
quotes: true
commas: true
lowercase: false
newtab: true

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  sourcemap: never

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor/
