title: Alex Nowak — Python & AI Engineer
description: Resume of a Python and artificial intelligence engineer building reliable machine-learning products.
url: https://alexnowak.github.io
baseurl: ""

theme: hacked-jekyll

lang: en
author: Alex Nowak

color_bg: gray-9
color_punct: green-9
color_key: green-4
color_value: green-4
color_hover: green-5
quotes: true
commas: true
lowercase: true
newtab: true

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  sourcemap: never

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor/
